id: northwind-fabric-app
name: Northwind Fabric App
version: 1.0.0
services:
  connectors:
    enabled: true
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://localhost:5174
      - http://127.0.0.1:5174
  data:
    enabled: false
    path: packages/data
    buildCommand: npm run build
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  storage:
    enabled: false
  functions:
    enabled: false
connectors:
  - name: northwind-model
    type: fabric-semanticmodel
    config:
      workspaceId: a02daae8-c62c-4ba8-a05b-7f3407192631
      itemId: 929e0650-3ad8-4911-aa70-dc9fe8f1d5d9
    auth:
      type: delegated
    version: "1"
    operations:
      - name: executeQuery
